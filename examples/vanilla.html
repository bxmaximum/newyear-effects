<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Year Effects — Vanilla JS</title>
    <link rel="stylesheet" href="../install/js/newyear/effects/engine/dist/engine.bundle.css">
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            background: linear-gradient(150deg, #081226, #17294d 60%, #0e1d38);
            color: #f8fafc;
            font: 16px/1.5 system-ui, sans-serif;
        }
        .demo-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 92px;
            padding: 22px 48px;
            background: rgba(7, 16, 35, 0.78);
        }
        .demo-logo {
            position: relative;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 22px;
            font-weight: 800;
        }
        main { max-width: 900px; margin: 110px auto 0; padding: 0 32px; text-align: center; }
        h1 { margin: 0 0 20px; font-size: clamp(36px, 6vw, 60px); line-height: 1.05; }
        p { color: #bfdbfe; font-size: 20px; }
    </style>
</head>
<body>
    <header class="demo-header">
        <div class="demo-logo">BXMax</div>
        <span>Vanilla JS, без сборки</span>
    </header>

    <main>
        <h1>Новогодние эффекты</h1>
        <p>Готовый bundle подключается обычными тегами link и script.</p>
    </main>

    <script type="application/json" id="newyear-effects-config">
    {
        "performance": {"mode":"auto","mobileMode":"eco","respectReducedMotion":true},
        "snow": {"enabled":true,"intensity":55,"speed":4,"sizeMin":6,"sizeMax":18,"wind":3,"interactive":true,"depth":true,"color":"#ffffff"},
        "garland": {"enabled":true,"selector":".demo-header","mode":"twinkle","colors":["#ff4d4f","#52c41a","#fadb14","#1890ff","#eb2f96"],"speed":1200,"offsetTop":0,"interactive":true},
        "decorations": {"enabled":true,"selector":".demo-logo","type":"hat","position":"top-right","size":"md"},
        "frost": {"enabled":true,"opacity":35},
        "sparkles": {"enabled":false},
        "widget": {"mode":"countdown","position":"bottom-right"}
    }
    </script>
    <script src="../install/js/newyear/effects/engine/dist/engine.bundle.js"></script>
</body>
</html>
