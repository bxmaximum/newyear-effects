name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Run PHP tests
        run: php -d auto_prepend_file= tests/php/run.php

  javascript:
    name: Node.js 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Lint Bitrix admin adapter
        run: npm run lint:admin

      - name: Build extensions
        run: npm run build

      - name: Check generated bundles
        shell: bash
        run: |
          paths=(
            install/js/newyear/effects/engine/dist
            install/js/newyear/effects/admin/dist
          )
          git diff --exit-code -- "${paths[@]}"
          if [[ -n "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]]; then
            git status --short --untracked-files=all -- "${paths[@]}"
            exit 1
          fi
